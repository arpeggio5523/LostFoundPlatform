stages:
  - test
  - e2e
  - deploy

test:unit:
  stage: test
  script:
    - npm ci
    - npm run test:coverage
  after_script:
    - node scripts/ci-after-test.js vitest
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
      - html/
      - coverage/
    reports:
      junit: reports/*_junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/*_cobertura.xml

test:e2e:
  stage: e2e
  script:
    - npm ci
    - npx playwright install chromium
    - npm run test:e2e
  after_script:
    - node scripts/ci-after-test.js playwright
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
      - playwright-report/
    reports:
      junit: reports/*_junit.xml

deploy:
  stage: deploy
  script:
    - echo "Add your deployment commands here"
  only:
    - main