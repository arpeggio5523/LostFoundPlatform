

stages:
  - test
  - e2e
  - deploy

test:unit:
  stage: test
  script:
    - npm ci
    - npm run test:coverage
  after_script:
    - mkdir -p reports
    - export TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    - export REPORT_NAME="vitest_${CI_PIPELINE_SOURCE:-unknown}_${GITLAB_USER_LOGIN:-unknown}_${CI_COMMIT_REF_SLUG:-unknown}_pipeline-${CI_PIPELINE_IID:-unknown}_${CI_COMMIT_SHORT_SHA:-unknown}_${TIMESTAMP}"
    - mv vitest-junit.xml reports/${REPORT_NAME}_junit.xml || true
    - mv coverage/cobertura-coverage.xml reports/${REPORT_NAME}_cobertura.xml || true
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
    reports:
      junit: reports/*_junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/*_cobertura.xml

test:e2e:
  stage: e2e
  script:
    - npm ci
    - npx playwright install --with-deps
    - npm run test:e2e
  after_script:
    - mkdir -p reports
    - export TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    - export REPORT_NAME="playwright_${CI_PIPELINE_SOURCE:-unknown}_${GITLAB_USER_LOGIN:-unknown}_${CI_COMMIT_REF_SLUG:-unknown}_pipeline-${CI_PIPELINE_IID:-unknown}_${CI_COMMIT_SHORT_SHA:-unknown}_${TIMESTAMP}"
    - mv playwright-junit.xml reports/${REPORT_NAME}_junit.xml || true
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
    reports:
      junit: reports/*_junit.xml

deploy:
  stage: deploy
  script:
    - echo "Add your deployment commands here"
  only:
    - main