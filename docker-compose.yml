services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy  # waits until MongoDB is actually ready

volumes:
  mongo_data: